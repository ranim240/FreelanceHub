<ion-content class="forgot-content" [fullscreen]="true">

  <div class="forgot-wrapper">

    <!-- Back Button -->
    <button class="back-btn" (click)="goBack()">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>

    <!-- Header -->
    <div class="header-section">
      <div class="brand-logo">
        <ion-icon name="key" class="logo-icon"></ion-icon>
      </div>
      <h1 class="page-title">Forgot Password?</h1>
      <p class="page-subtitle">Enter your email address and we'll send you a link to reset your password</p>
    </div>

    <!-- Form Card -->
    <div class="forgot-card">
      <form class="forgot-form" (ngSubmit)="onSubmit()">
        
        <!-- Email -->
        <div class="field-group">
          <label class="field-label">Email address</label>
          <div class="input-shell">
            <ion-icon name="at-outline" class="shell-icon"></ion-icon>
            <ion-input
              name="email"
              [(ngModel)]="email"
              type="email"
              placeholder="you@example.com"
              class="shell-input"
              fill="outline">
            </ion-input>
          </div>
        </div>

        <!-- Message -->
        <div class="message-box" *ngIf="message" [class.message-success]="isSuccess" [class.message-error]="!isSuccess">
          <ion-icon [name]="isSuccess ? 'checkmark-circle' : 'alert-circle'"></ion-icon>
          <span>{{ message }}</span>
        </div>

        <!-- CTA -->
        <ion-button 
          expand="block" 
          class="submit-btn" 
          type="submit"
          [disabled]="isSubmitting">
          <ion-spinner *ngIf="isSubmitting" name="crescent"></ion-spinner>
          <span *ngIf="!isSubmitting">Send Reset Link</span>
        </ion-button>

      </form>

      <!-- Back to Login -->
      <div class="login-row">
        <p>Remember your password?</p>
        <a routerLink="/login" class="login-link">
          Sign in
          <ion-icon name="arrow-forward-outline"></ion-icon>
        </a>
      </div>

    </div>

  </div>

</ion-content>
