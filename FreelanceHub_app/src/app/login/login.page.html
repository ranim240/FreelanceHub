<ion-content class="login-content" [fullscreen]="true">

  <!-- Decorative background shapes -->
  <div class="bg-shape bg-shape--circle"></div>
  <div class="bg-shape bg-shape--blob"></div>
  <div class="bg-dots"></div>

  <div class="login-wrapper">

    <!-- Brand -->
    <div class="brand-section">
      <div class="brand-text">
        <h1 class="brand-name">FreelanceHub</h1>
        <span class="brand-tag">Connect. Create. Collaborate.</span>
      </div>
    </div>

    <!-- Welcome message -->
    <div class="welcome-block">
      <h2 class="welcome-title">Welcome back<span class="title-dot">.</span></h2>
      <p class="welcome-sub">Sign in to access your workspace</p>
    </div>

    <!-- Role selector -->
    <div class="role-selector">
      <button class="role-btn role-btn--active">
        <ion-icon name="briefcase-outline"></ion-icon>
        <span>Freelancer</span>
      </button>
      <button class="role-btn">
        <ion-icon name="business-outline"></ion-icon>
        <span>Client</span>
      </button>
    </div>

    <!-- Form Card -->
    <div class="login-card">
      <form class="login-form">

        <!-- Email -->
        <div class="field-group">
          <label class="field-label">Email address</label>
          <div class="input-shell">
            <ion-icon name="at-outline" class="shell-icon"></ion-icon>
            <ion-input
              name="email"
              [(ngModel)]="email"
              type="password"
              type="email"
              placeholder="you@example.com"
              class="shell-input"
              fill="outline">
            </ion-input>
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <div class="label-row">
            <label class="field-label">Password</label>
            <a href="#" class="forgot-link">Forgot?</a>
          </div>
          <div class="input-shell">
            <ion-icon name="lock-closed-outline" class="shell-icon"></ion-icon>
            <ion-input
              name="password"
              [(ngModel)]="password"
              type="password"
              placeholder="••••••••"
              class="shell-input"
              fill="outline">
            </ion-input>
            <ion-icon name="eye-outline" class="shell-icon shell-icon--right"></ion-icon>
          </div>
        </div>

        <!-- Remember me -->
        <div class="remember-row">
          <ion-checkbox class="custom-checkbox" label-placement="end">
            <span class="checkbox-label">Remember me</span>
          </ion-checkbox>
        </div>

        <!-- CTA -->
        <ion-button expand="block" class="login-btn" type="submit" (click)="onLogin()">
          <ion-icon name="flash-outline" slot="start"></ion-icon>
          Sign in
        </ion-button>

      </form>

      <!-- Divider -->
      <div class="or-divider">
        <span></span>
        <p>or continue with</p>
        <span></span>
      </div>

      <!-- Social -->
      <div class="social-grid">
        <button class="social-pill">
          <ion-icon name="logo-google"></ion-icon>
          <span>Google</span>
        </button>
        <button class="social-pill">
          <ion-icon name="logo-linkedin"></ion-icon>
          <span>LinkedIn</span>
        </button>
      </div>
      
    <!-- Register -->
    <div class="register-row">
      <p>New to FreelanceHub?</p>
      <a routerLink="/register" class="register-link">
        Create an account
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </a>
    </div>


    </div>

  </div>

</ion-content>
