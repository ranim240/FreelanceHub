<ion-header class="prod-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/client/dashboard" text="" force-show="true"></ion-back-button>
    </ion-buttons>
    <ion-title>Products</ion-title>
    <ion-buttons slot="end">
      <button class="cart-btn" (click)="router.navigate(['/client/dashboard'], { queryParams: { showCart: 'true' } })">
        <ion-icon name="bag-outline"></ion-icon>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="prod-content">

  <!-- ── Search ── -->
  <div class="search-wrap">
    <div class="search-shell">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <ion-input
        [(ngModel)]="searchText"
        type="search"
        placeholder="Search products..."
        class="search-input"
        fill="outline">
      </ion-input>
    </div>
  </div>

  <!-- ── Filter Tabs ── -->
  <div class="filter-tabs">
    <button
      class="filter-tab"
      *ngFor="let f of filters"
      [class.filter-tab--active]="activeFilter === f.value"
      (click)="setFilter(f.value)">
      <ion-icon [name]="f.icon" style="margin-right: 6px; font-size: 16px;"></ion-icon>
      {{ f.label }}
    </button>
  </div>

  <!-- ── Products Grid ── -->
  <div class="prod-grid" *ngIf="filteredProducts.length > 0">
    <div
      class="prod-card"
      *ngFor="let p of filteredProducts"
      (click)="viewProduct(p)">

      <!-- Image -->
      <div class="prod-img-wrap">
        <img *ngIf="p.image" [src]="p.image" style="width: 100%; height: 100%; object-fit: cover; border-radius: 12px; position: absolute; top: 0; left: 0;" />
        <div class="prod-img-placeholder" *ngIf="!p.image">
          <ion-icon name="cube-outline"></ion-icon>
        </div>
        <span class="prod-status-badge"
          [ngClass]="'prod-badge--' + (p.status || 'approved').toLowerCase()">
          {{ p.status || 'Approved' }}
        </span>
      </div>

      <!-- Info -->
      <div class="prod-info">
        <h4 class="prod-name">{{ p.title }}</h4>
        <p class="prod-seller">by {{ p.author }}</p>
        <div class="prod-rating">
          <ion-icon name="star"></ion-icon>
          <span>{{ p.rating }}</span>
          <span class="prod-reviews">({{ p.reviews }})</span>
        </div>
        <div class="prod-footer">
          <span class="prod-price">{{ p.price }} DT</span>
          <button
            class="add-cart-btn"
            (click)="$event.stopPropagation(); addToCart(p)">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Empty State ── -->
  <div class="empty-state" *ngIf="filteredProducts.length === 0">
    <div class="empty-icon-wrap">
      <ion-icon name="cube-outline"></ion-icon>
    </div>
    <h3 class="empty-title">No products found</h3>
    <p class="empty-sub">Try adjusting your search or filters</p>
  </div>

  <div style="height: 90px;"></div>

</ion-content>

<!-- ── Bottom Nav ── -->
<div class="bottom-nav">
  <button class="nav-btn" (click)="navigate('client/dashboard')">
    <ion-icon name="grid-outline"></ion-icon>
    <span>Dashboard</span>
  </button>
  <button class="nav-btn" (click)="navigate('client/freelancers')">
    <ion-icon name="people-outline"></ion-icon>
    <span>Freelancers</span>
  </button>
  <button class="fab-tab" (click)="navigate('client/post-announcement')">
    <div class="fab-circle">
      <ion-icon name="add-outline"></ion-icon>
    </div>
  </button>
  <button class="nav-btn active">
    <ion-icon name="cube-outline"></ion-icon>
    <span>Products</span>
  </button>
  <button class="nav-btn" (click)="navigate('client/messages')">
    <ion-icon name="chatbubbles-outline"></ion-icon>
    <span>Messages</span>
  </button>
</div>
