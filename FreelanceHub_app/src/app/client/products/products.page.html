<ion-header class="prod-header">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/client/dashboard" text=""></ion-back-button>
    </ion-buttons>
    <ion-title>Products</ion-title>
    <ion-buttons slot="end">
      <button class="cart-btn" (click)="navigate('client/cart')">
        <ion-icon name="bag-outline"></ion-icon>
        <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
      </button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="prod-content">

  <!-- ── Search ── -->
  <div class="search-wrap">
    <div class="search-shell">
      <ion-icon name="search-outline" class="search-icon"></ion-icon>
      <ion-input
        [(ngModel)]="searchText"
        type="search"
        placeholder="Search products..."
        class="search-input"
        fill="outline">
      </ion-input>
    </div>
  </div>

  <!-- ── Filter Tabs ── -->
  <div class="filter-tabs">
    <button
      class="filter-tab"
      *ngFor="let f of filters"
      [class.filter-tab--active]="activeFilter === f.value"
      (click)="setFilter(f.value)">
      {{ f.label }}
    </button>
  </div>

  <!-- ── Products Grid ── -->
  <div class="prod-grid" *ngIf="filteredProducts.length > 0">
    <div
      class="prod-card"
      *ngFor="let p of filteredProducts"
      (click)="viewProduct(p)">

      <!-- Image -->
      <div class="prod-img-wrap">
        <div class="prod-img-placeholder">
          <ion-icon name="cube-outline"></ion-icon>
        </div>
        <span class="prod-status-badge"
          [ngClass]="'prod-badge--' + p.status.toLowerCase()">
          {{ p.status }}
        </span>
      </div>

      <!-- Info -->
      <div class="prod-info">
        <h4 class="prod-name">{{ p.name }}</h4>
        <p class="prod-seller">by {{ p.seller }}</p>
        <div class="prod-rating">
          <ion-icon name="star"></ion-icon>
          <span>{{ p.rating }}</span>
          <span class="prod-reviews">({{ p.reviewCount }})</span>
        </div>
        <div class="prod-footer">
          <span class="prod-price">{{ p.price }} DT</span>
          <button
            class="add-cart-btn"
            (click)="$event.stopPropagation(); addToCart(p)">
            <ion-icon name="add-outline"></ion-icon>
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- ── Empty State ── -->
  <div class="empty-state" *ngIf="filteredProducts.length === 0">
    <div class="empty-icon-wrap">
      <ion-icon name="cube-outline"></ion-icon>
    </div>
    <h3 class="empty-title">No products found</h3>
    <p class="empty-sub">Try adjusting your search or filters</p>
  </div>

  <div style="height: 90px;"></div>

</ion-content>

<!-- ── Bottom Nav ── -->
<ion-tab-bar class="bottom-nav">
  <ion-tab-button (click)="navigate('client/dashboard')">
    <ion-icon name="grid-outline"></ion-icon>
    <ion-label>Dashboard</ion-label>
  </ion-tab-button>
  <ion-tab-button (click)="navigate('client/freelancers')">
    <ion-icon name="people-outline"></ion-icon>
    <ion-label>Freelancers</ion-label>
  </ion-tab-button>
  <ion-tab-button class="fab-tab" (click)="navigate('client/post-announcement')">
    <div class="fab-circle">
      <ion-icon name="add-outline"></ion-icon>
    </div>
  </ion-tab-button>
  <ion-tab-button selected>
    <ion-icon name="cube-outline"></ion-icon>
    <ion-label>Products</ion-label>
  </ion-tab-button>
  <ion-tab-button (click)="navigate('client/messages')">
    <ion-icon name="chatbubbles-outline"></ion-icon>
    <ion-label>Messages</ion-label>
  </ion-tab-button>
</ion-tab-bar>
