<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <button class="hdr-btn-ghost" (click)="goBack()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </button>
      <span class="hdr-brand">Announcements</span>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ann-content">
  <div class="ann-list" *ngIf="!loading">
    <div
      class="ann-card"
      *ngFor="let ann of announcements"
      (click)="openAnnouncement(ann)">

      <div class="ann-top">
        <div class="ann-avatar">{{ ann.clientInitials }}</div>
        <div class="ann-meta">
          <p class="ann-client">{{ ann.clientName }}</p>
          <p class="ann-date">{{ ann.postedAt }}</p>
        </div>
        <span class="ann-badge" [class.ann-badge--urgent]="ann.status === 'Urgent'">
          {{ ann.status }}
        </span>
      </div>

      <h3 class="ann-title">{{ ann.title }}</h3>
      <p class="ann-desc">{{ ann.description }}</p>

      <div class="ann-tags">
        <span class="ann-tag" *ngFor="let tag of ann.tags">{{ tag }}</span>
      </div>

      <div class="ann-footer">
        <div class="ann-meta-info">
          <span class="ann-info-item">
            <ion-icon name="cash-outline"></ion-icon> {{ ann.budget }}
          </span>
          <span class="ann-info-item">
            <ion-icon name="time-outline"></ion-icon> {{ ann.deadline }}
          </span>
        </div>
        <button class="ann-msg-btn" (click)="$event.stopPropagation();">
          <ion-icon name="chatbubble-outline"></ion-icon> Message
        </button>
      </div>
    </div>
  </div>

  <div *ngIf="loading" style="text-align: center; padding: 40px;">
    <ion-spinner name="crescent"></ion-spinner>
    <p style="color: var(--c-muted); margin-top: 10px; font-size: 13px;">Loading announcements...</p>
  </div>
</ion-content>
