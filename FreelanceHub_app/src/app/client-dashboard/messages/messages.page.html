<ion-header collapse="condense">
  <ion-toolbar>
    <ion-title size="large">Messages</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let message of messages$ | async" lines="inset">
      <ion-avatar slot="start">
        <img src="assets/icon/favicon.png" alt="Avatar" />
      </ion-avatar>
      <ion-label>
        <h2>{{ message.interlocutor }}</h2>
        <p>{{ message.lastMessage }}</p>
        <ion-note slot="end">{{ message.time }}</ion-note>
      </ion-label>
    </ion-item>
  </ion-list>
</ion-content>
