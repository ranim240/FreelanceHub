<ion-header>
  <ion-toolbar color="primary">
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Dashboard Client</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Custom Header -->
  <div class="dashboard-header">
    <div class="profile-section">
      <img src="assets/icon/favicon.png" class="profile-pic" alt="Profile" />
      <div class="profile-info">
        <h2>Client Client <ion-icon name="checkmark-circle" class="verified-badge"></ion-icon></h2>
        <p>Biographie courte du client...</p>
      </div>
    </div>
    <button class="settings-btn" (click)="goProfile()">
      <ion-icon name="settings-outline"></ion-icon>
    </button>
  </div>

  <!-- Secondary Tabs -->
  <ion-segment [(ngModel)]="selectedTab" color="dark" class="secondary-tabs">
    <ion-segment-button value="posts">
      <ion-label>Posts</ion-label>
    </ion-segment-button>
    <ion-segment-button value="messages">
      <ion-label>Messages</ion-label>
    </ion-segment-button>
    <ion-segment-button value="panier">
      <ion-label>Panier</ion-label>
    </ion-segment-button>
    <ion-segment-button value="publier">
      <ion-label>Publier</ion-label>
    </ion-segment-button>
  </ion-segment>

  <router-outlet></router-outlet>
</ion-content>

<!-- Bottom Nav -->
<ion-footer>
  <ion-toolbar>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="home" (click)="goHome()">
        <ion-icon name="home-outline"></ion-icon>
        <ion-label>Home</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="wallet" (click)="goWallet()">
        <ion-icon name="wallet-outline"></ion-icon>
        <ion-label>Wallet</ion-label>
      </ion-tab-button>
      <ion-tab-button tab="profile" (click)="goProfile()">
        <ion-icon name="person-outline"></ion-icon>
        <ion-label>Profile</ion-label>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-toolbar>
</ion-footer>
