<ion-header collapse="condense">
  <ion-toolbar>
    <ion-title size="large">Posts</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let post of posts$ | async" lines="full" class="post-item">
      <ion-card class="post-card">
        <ion-card-header>
          <ion-card-title>{{ post.title }}</ion-card-title>
        </ion-card-header>
        <ion-card-content>
          <p>{{ post.description }}</p>
          <div class="post-footer">
            <span class="budget">{{ post.budget }}</span>
            <span class="proposals">{{ post.proposals }} propositions</span>
          </div>
        </ion-card-content>
      </ion-card>
    </ion-item>
  </ion-list>
</ion-content>
