<ion-header collapse="condense">
  <ion-toolbar>
    <ion-title size="large">Paramètres</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item button routerLink="/profil">
      <ion-icon name="person-outline" slot="start"></ion-icon>
      <ion-label>Modifier profil</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item button routerLink="/login">
      <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
      <ion-label>Mot de passe</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item button>
      <ion-icon name="mail-outline" slot="start"></ion-icon>
      <ion-label>Email</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>

    <ion-item lines="none">
      <ion-icon name="notifications-outline" slot="start"></ion-icon>
      <ion-label>Notifications</ion-label>
      <ion-toggle slot="end" [(ngModel)]="notificationsEnabled" (ionChange)="toggleNotifications()"></ion-toggle>
    </ion-item>

    <ion-item button>
      <ion-icon name="card-outline" slot="start"></ion-icon>
      <ion-label>Historique de paiement</ion-label>
      <ion-icon name="chevron-forward-outline" slot="end"></ion-icon>
    </ion-item>
  </ion-list>
</ion-content>
