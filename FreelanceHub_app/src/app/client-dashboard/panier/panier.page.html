<ion-header collapse="condense">
  <ion-toolbar>
    <ion-title size="large">Panier</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list>
    <ion-item *ngFor="let item of cart$ | async" lines="full">
      <ion-thumbnail slot="start">
        <img [src]="item.image" [alt]="item.name" />
      </ion-thumbnail>
      <ion-label>
        <h2>{{ item.name }}</h2>
        <p>{{ item.price }}</p>
      </ion-label>
    </ion-item>
  </ion-list>

  <div class="total-section">
    <div class="total-row">
      <span>Sous-total</span>
      <span>{{ subtotal }}</span>
    </div>
    <ion-button expand="block" fill="solid" color="dark" (click)="proceedToPayment()">
      Procéder au paiement
    </ion-button>
  </div>
</ion-content>
